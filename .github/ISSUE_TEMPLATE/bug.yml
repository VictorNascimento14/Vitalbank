name: Bug
description: Algo que não funciona como deveria.
labels: []
body:
  - type: textarea
    id: acontece
    attributes:
      label: O que acontece
      description: Tela, tamanho (1440 / 1024 / 375 px), tema (claro/escuro) e o que aparece.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
  - type: textarea
    id: porque
    attributes:
      label: Por quê (se já se sabe)
